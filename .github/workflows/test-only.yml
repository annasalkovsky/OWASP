name: OWASP Dependency Audit Tool - Tests Only

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./OWASP
    
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './OWASP/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: npm run lint
      
    - name: Run tests with coverage
      run: npm run test:coverage
      
    - name: Upload coverage reports to Codecov
      if: matrix.node-version == '18.x'
      uses: codecov/codecov-action@v3
      continue-on-error: true
      with:
        file: ./OWASP/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --audit-level moderate
      continue-on-error: true
      
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript
        
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  validate:
    name: Application Validation
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Check JavaScript syntax
      run: |
        echo "Testing application file handling capabilities..."
        node -e "
          const fs = require('fs');
          
          // Test JSON parsing
          try {
            JSON.parse('{\"test\": true}');
            console.log('✅ JSON parsing works');
          } catch (e) {
            console.error('❌ JSON parsing failed');
            process.exit(1);
          }
          
          // Test file operations
          try {
            const testFile = 'test-file.json';
            fs.writeFileSync(testFile, '{\"dependencies\": {}}');
            const content = fs.readFileSync(testFile, 'utf8');
            JSON.parse(content);
            fs.unlinkSync(testFile);
            console.log('✅ File operations work');
          } catch (e) {
            console.error('❌ File operations failed');
            process.exit(1);
          }
          
          console.log('🎉 All validation checks passed!');
        "

  notify:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [test, security, validate]
    if: always()
    
    steps:
    - name: Build status summary
      run: |
        echo "## 🧪 OWASP Dependency Audit Tool - Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Job Results:" >> $GITHUB_STEP_SUMMARY
        echo "- **Tests**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Security**: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Validation**: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.test.result }}" == "success" ]; then
          echo "### ✅ Test Suite Results:" >> $GITHUB_STEP_SUMMARY
          echo "- **35 tests** across 4 test suites" >> $GITHUB_STEP_SUMMARY
          echo "- **Core Tests**: File processing, validation, error handling" >> $GITHUB_STEP_SUMMARY
          echo "- **Reports Tests**: HTML generation, export functionality" >> $GITHUB_STEP_SUMMARY
          echo "- **Integration Tests**: Complete workflows, tab navigation" >> $GITHUB_STEP_SUMMARY
          echo "- **Upload Tests**: File handling, drag-and-drop, progress" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🎯 Coverage Information:" >> $GITHUB_STEP_SUMMARY
        echo "- Jest test framework with jsdom environment" >> $GITHUB_STEP_SUMMARY
        echo "- Comprehensive DOM simulation and mocking" >> $GITHUB_STEP_SUMMARY
        echo "- Code quality checks with ESLint" >> $GITHUB_STEP_SUMMARY